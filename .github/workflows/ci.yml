name: tests

# The golden-set gate. Any prompt, model or schema change has to clear the
# field-level expectations in tests/fixtures/golden.json before it merges.
on: [push, pull_request]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: pytest
